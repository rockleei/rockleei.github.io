<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sürpriz</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #ffc0cb, #dda0dd, #ff69b4);
      font-family: 'Pacifico', cursive;
      overflow-x: hidden;
    }

    .container {
      text-align: center;
      padding: 50px 20px;
      color: white;
    }

    h1 {
      font-size: 3rem;
      animation: fadeIn 2s ease-in-out;
    }

    .button-link {
      display: inline-block;
      margin: 20px 10px;
      padding: 15px 30px;
      font-size: 1.5rem;
      color: white;
      background-color: #ff69b4;
      border: none;
      border-radius: 25px;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .button-link:hover {
      background-color: #ff1493;
      transform: scale(1.05);
    }

    /* Müzik çalar */
    .music-player {
      margin: 20px 0;
    }

    /* Sürpriz butonu */
    .surprise-button {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 1.3rem;
      background-color: #ffb6c1;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      font-family: inherit;
    }

    .surprise-button:hover {
      background-color: #ff69b4;
    }

    .surprise-text {
      margin-top: 20px;
      font-size: 1.5rem;
      color: white;
      min-height: 40px;
    }

    /* Geri dönme butonu */
    .back-button {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 50px;
      height: 50px;
      margin: 20px 25px 25px auto;
      color: white;
      background-color: #ff69b4;
      border-radius: 50%;
      text-decoration: none;
      font-size: 20px;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .back-button:hover {
      transform: scale(1.05);
      background-color: #ff1493;
    }

    /* Spotify playlist kutusu */
    .kutu {
      box-sizing: border-box;
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      padding: 15px;
      background: #202020;
      border-radius: 18px;
      scroll-margin-top: 20px;
    }

    .kutu h1 {
      color: white;
      font-size: 2rem;
    }

    .kutu p {
      text-align: center;
      color: #b3b3b3;
    }

    .kutu iframe {
      display: block;
      width: 100%;
      height: 352px;
      border: none;
      border-radius: 12px;
    }

    /* Uçuşan kalpler */
    .hearts {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      top: 0;
      left: 0;
      z-index: 999;
    }

    .heart {
      width: 20px;
      height: 20px;
      background: red;
      position: absolute;
      transform: rotate(45deg);
      animation: floatUp 5s linear infinite;
    }

    .heart:before,
    .heart:after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart:before {
      top: -10px;
      left: 0;
    }

    .heart:after {
      left: -10px;
      top: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(1) rotate(45deg);
        opacity: 1;
      }

      100% {
        transform: translateY(-10vh) scale(1.2) rotate(45deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes pop {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      50% {
        transform: scale(1.2);
        opacity: 1;
      }

      100% {
        transform: scale(1);
      }
    }

    .surprise-text.animate {
      animation: pop 0.6s ease;
    }

    /* Küçük ekranlara uyum */
    @media (max-width: 600px) {
      .container {
        padding: 30px 12px;
      }

      h1 {
        font-size: 2.3rem;
      }

      .button-link {
        margin: 10px 5px;
        padding: 12px 20px;
        font-size: 1.2rem;
      }

      .surprise-button {
        max-width: 100%;
        font-size: 1rem;
      }

      .kutu {
        padding: 12px;
      }

      .kutu h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Sürpriz &lt;3</h1>

    <!-- Sayfa bağlantıları -->
    <a class="button-link" href="galeri.html">Galeri 📸</a>
    <a class="button-link" href="spotify.html">Playlist 🎧</a>

    <!-- Spotify playlist -->
    <div class="kutu">
      <h1>Playlist</h1>

      <iframe
        src="https://open.spotify.com/embed/playlist/4zjCjicexa9dn9NKduchSo?utm_source=generator"
        title="Spotify Şarkı Listem"
        allowfullscreen
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>

    <!-- Müzik çalar -->
    <div class="music-player">
      <audio controls autoplay loop>
        <source src="gorseller/Lovers Rock - TV Girl.mp3" type="audio/mpeg">
      </audio>
    </div>

    <!-- Sürpriz mesajı -->
    <button class="surprise-button" onclick="showReason()">
      Tıkla ve seni neden sevdiğimi öğren 🥺😜
    </button>

    <div class="surprise-text" id="reasonBox"></div>

  </div>

  <!-- Uçuşan kalpler -->
  <div class="hearts" id="hearts"></div>

  <!-- Geri dönme butonu -->
  <a href="index.html" class="back-button" aria-label="Ana sayfaya dön">
    <i class="fas fa-arrow-left"></i>
  </a>

  <script>
    const heartsContainer = document.getElementById("hearts");

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 2) + "s";

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    // Kalpleri sürekli oluştur
    setInterval(createHeart, 300);

    // Rastgele sevgi mesajları
    const reasons = [
      "Çünkü tanrıçamsın",
      "Çünkü kuzumsun 😻",
      "Çünkü şapşalsın 😜",
      "Çünkü esseksin",
      "Çünkü alıksın",
      "Seni seviyorum askim <3"
    ];

    function showReason() {
      const reasonBox = document.getElementById("reasonBox");
      const random = Math.floor(Math.random() * reasons.length);

      reasonBox.innerText = reasons[random];

      // Mesaj animasyonunu yeniden başlat
      reasonBox.classList.remove("animate");
      void reasonBox.offsetWidth;
      reasonBox.classList.add("animate");
    }
  </script>

</body>
</html>
```
